<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Two sides of a BACnet exchange</title><desc id="desc">Study-guide example: a client reads a property from a supporting device.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#176b67"/></marker></defs><rect width="760" height="420" rx="14" fill="#edf1e9"/><g font-family="Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#14323a" font-weight="bold" text-anchor="start">Two sides of a BACnet exchange</text><text x="32" y="72" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Study-guide example: a client reads a property from a supporting device.</text><rect x="32" y="126" width="265" height="132" rx="8" fill="#176b67"/><rect x="463" y="126" width="265" height="132" rx="8" fill="#14323a"/><text x="164" y="162" font-size="25" fill="white" font-weight="bold" text-anchor="middle">Controller</text><text x="164" y="195" font-size="24" fill="#eab866" font-weight="bold" text-anchor="middle">DS-RP-A</text><text x="164" y="229" font-size="17" fill="white" font-weight="normal" text-anchor="middle">Initiates ReadProperty</text><text x="595" y="162" font-size="25" fill="white" font-weight="bold" text-anchor="middle">Thermostat</text><text x="595" y="195" font-size="24" fill="#eab866" font-weight="bold" text-anchor="middle">DS-RP-B</text><text x="595" y="229" font-size="17" fill="white" font-weight="normal" text-anchor="middle">Responds to ReadProperty</text><path d="M305 162 L451 162" fill="none" stroke="#176b67" stroke-width="4" marker-end="url(#arrow)"/><path d="M455 226 L309 226" fill="none" stroke="#176b67" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="143" font-size="16" fill="#176b67" font-weight="normal" text-anchor="middle">Request</text><text x="380" y="255" font-size="16" fill="#176b67" font-weight="normal" text-anchor="middle">Response</text><text x="32" y="322" font-size="22" fill="#14323a" font-weight="bold" text-anchor="start">Complementary capabilities enable the exchange.</text><text x="32" y="356" font-size="17" fill="#51646a" font-weight="normal" text-anchor="start">Check the PICS, required services and point permissions together.</text></g></svg>