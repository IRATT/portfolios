<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Integration at four levels</title><desc id="desc">A system must work across equipment, functions, applications and sites.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#176b67"/></marker></defs><rect width="760" height="420" rx="14" fill="#edf1e9"/><g font-family="Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#14323a" font-weight="bold" text-anchor="start">Integration at four levels</text><text x="32" y="72" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">A system must work across equipment, functions, applications and sites.</text><rect x="32" y="100" width="44" height="44" rx="8" fill="#176b67"/><text x="54" y="129" font-size="18" fill="white" font-weight="bold" text-anchor="middle">01</text><text x="94" y="119" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">Device</text><text x="94" y="144" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Exchange values and commands with equipment.</text><rect x="32" y="172" width="44" height="44" rx="8" fill="#176b67"/><text x="54" y="201" font-size="18" fill="white" font-weight="bold" text-anchor="middle">02</text><text x="94" y="191" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">Functional</text><text x="94" y="216" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Coordinate functions such as occupancy and HVAC.</text><rect x="32" y="244" width="44" height="44" rx="8" fill="#176b67"/><text x="54" y="273" font-size="18" fill="white" font-weight="bold" text-anchor="middle">03</text><text x="94" y="263" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">Application</text><text x="94" y="288" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Connect maintenance, reporting and workflows.</text><rect x="32" y="316" width="44" height="44" rx="8" fill="#176b67"/><text x="54" y="345" font-size="18" fill="white" font-weight="bold" text-anchor="middle">04</text><text x="94" y="335" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">Cloud</text><text x="94" y="360" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Bring context together across a portfolio of sites.</text></g></svg>