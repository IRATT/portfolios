abling pathways.</text><rect x="32" y="316" width="44" height="44" rx="8" fill="#176b67"/><text x="54" y="345" font-size="18" fill="white" font-weight="bold" text-anchor="middle">04</text><text x="94" y="335" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">Protection</text><text x="94" y="360" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Smoke detection, sprinklers, cameras and access.</text></g></svg>