<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">West Hall: organize around client needs</title><desc id="desc">Source: IA final case-study presentation, layout and revised client scenario.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#176b67"/></marker></defs><rect width="760" height="420" rx="14" fill="#edf1e9"/><g font-family="Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#14323a" font-weight="bold" text-anchor="start">West Hall: organize around client needs</text><text x="32" y="72" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Source: IA final case-study presentation, layout and revised client scenario.</text><rect x="32" y="118" width="225" height="100" rx="8" fill="#176b67"/><text x="50" y="153" font-size="23" fill="white" font-weight="bold" text-anchor="start">Client 1</text><text x="50" y="190" font-size="16" fill="white" font-weight="normal" text-anchor="start">Managed hosting</text><rect x="277" y="118" width="225" height="100" rx="8" fill="#14323a"/><text x="295" y="153" font-size="23" fill="white" font-weight="bold" text-anchor="start">Client 2</text><text x="295" y="190" font-size="16" fill="white" font-weight="normal" text-anchor="start">Data blocks / movers</text><rect x="522" y="118" width="225" height="100" rx="8" fill="#176b67"/><text x="540" y="153" font-size="23" fill="white" font-weight="bold" text-anchor="start">Client 3</text><text x="540" y="190" font-size="16" fill="white" font-weight="normal" text-anchor="start">Cloud racks / network</text><rect x="32" y="240" width="470" height="61" rx="8" fill="#dce5dd"/><text x="51" y="277" font-size="20" fill="#14323a" font-weight="normal" text-anchor="start">Circulation + supporting infrastructure</text><rect x="521" y="240" width="207" height="61" rx="8" fill="#ecd7b4"/><text x="539" y="277" font-size="19" fill="#14323a" font-weight="normal" text-anchor="start">Expansion space</text><text x="32" y="350" font-size="21" fill="#14323a" font-weight="bold" text-anchor="start">A client business update changes the supporting design.</text><text x="32" y="383" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Spatial relationships are illustrative; this is not the original floor plan.</text></g></svg>