<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Communication workload matters</title><desc id="desc">Illustration: ten points, read once per minute; request + response counted.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#176b67"/></marker></defs><rect width="760" height="420" rx="14" fill="#edf1e9"/><g font-family="Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#14323a" font-weight="bold" text-anchor="start">Communication workload matters</text><text x="32" y="72" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Illustration: ten points, read once per minute; request + response counted.</text><text x="32" y="122" font-size="20" fill="#14323a" font-weight="normal" text-anchor="start">Individual reads</text><rect x="32" y="140" width="630" height="45" rx="8" fill="#176b67"/><text x="680" y="171" font-size="23" fill="#14323a" font-weight="bold" text-anchor="start">20</text><text x="32" y="230" font-size="20" fill="#14323a" font-weight="normal" text-anchor="start">Grouped read</text><rect x="32" y="248" width="63" height="45" rx="8" fill="#eab866"/><text x="113" y="279" font-size="23" fill="#14323a" font-weight="bold" text-anchor="start">2</text><text x="32" y="340" font-size="20" fill="#14323a" font-weight="bold" text-anchor="start">Application messages per minute</text><text x="32" y="373" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Assumes one grouped request and response can carry all ten points.</text></g></svg>