<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Follow the air through the load</title><desc id="desc">Conceptual cooling diagram redrawn from the course themes; not to scale.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#176b67"/></marker></defs><rect width="760" height="420" rx="14" fill="#edf1e9"/><g font-family="Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#14323a" font-weight="bold" text-anchor="start">Follow the air through the load</text><text x="32" y="72" font-size="15" fill="#51646a" font-weight="normal" text-anchor="start">Conceptual cooling diagram redrawn from the course themes; not to scale.</text><rect x="32" y="122" width="195" height="150" rx="8" fill="#d2e6e4"/><rect x="284" y="122" width="192" height="150" rx="8" fill="#14323a"/><rect x="533" y="122" width="195" height="150" rx="8" fill="#ecd7b4"/><text x="129" y="163" font-size="25" fill="#176b67" font-weight="bold" text-anchor="middle">Cold aisle</text><text x="129" y="200" font-size="18" fill="#14323a" font-weight="normal" text-anchor="middle">Rack inlet</text><text x="129" y="233" font-size="18" fill="#14323a" font-weight="normal" text-anchor="middle">Supply air</text><text x="380" y="164" font-size="25" fill="white" font-weight="bold" text-anchor="middle">IT rack</text><text x="380" y="200" font-size="18" fill="white" font-weight="normal" text-anchor="middle">Front → back</text><text x="380" y="233" font-size="18" fill="#eab866" font-weight="normal" text-anchor="middle">Heat added</text><text x="631" y="163" font-size="25" fill="#14323a" font-weight="bold" text-anchor="middle">Hot aisle</text><text x="631" y="200" font-size="18" fill="#14323a" font-weight="normal" text-anchor="middle">Rack exhaust</text><text x="631" y="233" font-size="18" fill="#14323a" font-weight="normal" text-anchor="middle">Return air</text><path d="M232 196 L275 196" fill="none" stroke="#176b67" stroke-width="4" marker-end="url(#arrow)"/><path d="M482 196 L526 196" fill="none" stroke="#176b67" stroke-width="4" marker-end="url(#arrow)"/><text x="32" y="327" font-size="23" fill="#14323a" font-weight="bold" text-anchor="start">Keep supply and return air separated.</text><text x="32" y="365" font-size="16" fill="#51646a" font-weight="normal" text-anchor="start">Control bypass and recirculation; check the conditions at rack inlets.</text></g></svg>